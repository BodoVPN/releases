name: Build the Xray core (libXray)

# Builds XTLS/libXray (MIT) at a pinned tag for every client platform and publishes the
# result as the pre-release `core-<tag>` on this repo, with SHA256SUMS and manifest.json.
# The apps take Xray from these builds, not from upstream's zips, so every toolchain
# version is pinned below and recorded in manifest.json. A pre-release never becomes
# "latest", so the app download page (this repo's latest release) is left alone.
# Every native binary is checked to be stripped and free of runner paths, and every
# release file gets a build-provenance attestation.
#
# Trigger: gh workflow run core.yml -R BodoVPN/releases -f libxray_tag=v26.9.30
# Only a run from main publishes. A run from any other branch builds and checks every
# target and keeps manifest.json and SHA256SUMS as a workflow artifact.

on:
  workflow_dispatch:
    inputs:
      libxray_tag:
        description: "XTLS/libXray tag to build (vYY.M.D)"
        required: true
  push:
    branches: [ci/core-build]

concurrency:
  group: core-${{ inputs.libxray_tag }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  LIBXRAY_TAG: ${{ inputs.libxray_tag || 'v26.9.30' }}
  GO_VERSION: "1.27.1"
  GOTOOLCHAIN: local
  LIBXRAY_GOMOBILE_VERSION: v0.0.0-20260908204917-8b95e45f8d3e
  NDK_VERSION: r30
  NDK_REVISION: "30.0.16248370"
  ANDROID_PLATFORM: android-36
  JAVA_VERSION: "21.0.12+8.0.LTS"
  XCODE_VERSION: "26.6"
  PYTHON_VERSION: "3.14.7"
  CGO_ENABLED: "1"

jobs:
  # Every build checks out this one commit, so a tag moved mid-run can't mix sources.
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.tag.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Resolve the libXray tag to a commit
        id: tag
        run: python3 .github/scripts/core.py resolve

  linux-x64:
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TARGET: linux-x64
    steps:
      - &checkout-ci
        name: Check out the build helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ci
          sparse-checkout: .github/scripts
          persist-credentials: false

      - &checkout-libxray
        name: Check out XTLS/libXray at the resolved commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: XTLS/libXray
          ref: ${{ needs.resolve.outputs.commit }}
          path: libxray
          persist-credentials: false

      - &setup-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - &setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Build
        working-directory: libxray
        run: python build/main.py linux

      - name: Smoke-check and package
        run: |
          S="stage/libxray-$TARGET"
          mkdir -p "$S"
          cp libxray/linux_so/libXray.so libxray/linux_so/libXray.h libxray/bin/xray libxray/LICENSE "$S/"
          python ci/.github/scripts/core.py desktop "$S" --exe xray --lib libXray.so --machine x86_64 --out contents.json
          python ci/.github/scripts/core.py info --src libxray --target "$TARGET" --contents contents.json \
            --tool "cc=$(gcc --version | head -1)" --out "stage/libxray-$TARGET.json"
          SOURCE_DATE_EPOCH="$(git -C libxray log -1 --format=%ct)" python ci/.github/scripts/core.py zip "$S" "stage/libxray-$TARGET.zip"

      - &upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: core-${{ env.TARGET }}
          path: |
            stage/libxray-${{ env.TARGET }}.zip
            stage/libxray-${{ env.TARGET }}.json
          if-no-files-found: error

  windows-x64:
    needs: resolve
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      TARGET: windows-x64
      GOARCH: amd64
    steps:
      - *checkout-ci
      - *checkout-libxray
      - *setup-python
      - *setup-go

      - name: Test the desktop Core
        working-directory: libxray
        run: go test ./dns ./desktop_bin -count=1

      - name: Build
        working-directory: libxray
        run: python build/main.py windows

      - name: Smoke-check and package
        run: |
          S="stage/libxray-$TARGET"
          mkdir -p "$S"
          cp libxray/windows_dll/libXray.dll libxray/windows_dll/libXray.h libxray/bin/xray.exe libxray/LICENSE "$S/"
          python ci/.github/scripts/core.py desktop "$S" --exe xray.exe --lib libXray.dll --machine x86_64 --out contents.json
          python ci/.github/scripts/core.py info --src libxray --target "$TARGET" --contents contents.json \
            --tool "cc=$(gcc --version | head -1)" --out "stage/libxray-$TARGET.json"
          SOURCE_DATE_EPOCH="$(git -C libxray log -1 --format=%ct)" python ci/.github/scripts/core.py zip "$S" "stage/libxray-$TARGET.zip"

      - *upload

  android:
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TARGET: android
    steps:
      - *checkout-ci
      - *checkout-libxray
      - *setup-python
      - *setup-go

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # gomobile compiles against the newest platform under ANDROID_HOME and the runner's
      # SDK carries many, so the build gets a clean SDK holding only the pinned ones.
      - name: Install the pinned Android platform and NDK
        run: |
          SDK="$RUNNER_TEMP/android-sdk"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          { yes || true; } | "$SDKMANAGER" --sdk_root="$SDK" --licenses > /dev/null
          "$SDKMANAGER" --sdk_root="$SDK" --install "platforms;$ANDROID_PLATFORM" "ndk;$NDK_REVISION" > /dev/null
          NDK="$SDK/ndk/$NDK_REVISION"
          grep -q "^Pkg.Revision = $NDK_REVISION$" "$NDK/source.properties" || { cat "$NDK/source.properties"; echo "::error::NDK is not $NDK_REVISION"; exit 1; }
          ls "$SDK/platforms"
          {
            echo "ANDROID_HOME=$SDK"
            echo "ANDROID_SDK_ROOT=$SDK"
            echo "ANDROID_NDK_HOME=$NDK"
          } >> "$GITHUB_ENV"

      # libXray's gomobile command passes neither -trimpath nor -s -w (its cgo, Linux and
      # Windows builds do), so its AAR carries runner paths and full symbols. Add both.
      - name: Strip and trim libXray's gomobile build
        run: python ci/.github/scripts/core.py patch-gomobile --src libxray --script android.py --out patch.json

      - name: Build
        working-directory: libxray
        run: python build/main.py android

      - name: Smoke-check and package
        run: |
          S="stage/libxray-$TARGET"
          mkdir -p "$S"
          cp libxray/libXray.aar libxray/libXray-sources.jar libxray/LICENSE "$S/"
          python ci/.github/scripts/core.py aar "$S/libXray.aar" --out contents.json
          python ci/.github/scripts/core.py info --src libxray --target "$TARGET" --contents contents.json --patch patch.json \
            --tool "gomobile=$LIBXRAY_GOMOBILE_VERSION" \
            --tool "ndk=$NDK_VERSION ($(sed -n 's/^Pkg.Revision = //p' "$ANDROID_NDK_HOME/source.properties"))" \
            --tool "androidPlatform=$(ls "$ANDROID_HOME/platforms")" \
            --tool "javac=$(javac -version 2>&1)" --out "stage/libxray-$TARGET.json"
          SOURCE_DATE_EPOCH="$(git -C libxray log -1 --format=%ct)" python ci/.github/scripts/core.py zip "$S" "stage/libxray-$TARGET.zip"

      - *upload

  # gomobile: LibXray.xcframework of static frameworks (iOS, iOS simulator, macOS, Mac Catalyst).
  apple-gomobile:
    needs: resolve
    runs-on: macos-26
    timeout-minutes: 90
    env:
      TARGET: apple-gomobile
    steps:
      - &select-xcode
        name: Select the pinned Xcode
        run: |
          sudo xcode-select -s "/Applications/Xcode_$XCODE_VERSION.app/Contents/Developer"
          xcodebuild -version
          xcodebuild -version | head -1 | grep -qx "Xcode $XCODE_VERSION" || { echo "::error::not Xcode $XCODE_VERSION"; exit 1; }

      - *checkout-ci
      - *checkout-libxray
      - *setup-python
      - *setup-go

      - name: Strip and trim libXray's gomobile build
        run: python ci/.github/scripts/core.py patch-gomobile --src libxray --script apple_gomobile.py --out patch.json

      - name: Build
        working-directory: libxray
        run: python build/main.py apple gomobile

      # The xcframework sits at the zip root, the layout a SwiftPM binaryTarget expects.
      - &package-apple
        name: Smoke-check and package
        run: |
          S="stage/libxray-$TARGET"
          mkdir -p "$S"
          cp -R libxray/LibXray.xcframework "$S/"
          cp libxray/LICENSE "$S/"
          python ci/.github/scripts/core.py xcframework "$S/LibXray.xcframework" --require ios,ios-simulator,macos \
            --max-minos "${MAX_MINOS:-}" --out contents.json
          SOURCE_DATE_EPOCH="$(git -C libxray log -1 --format=%ct)" python ci/.github/scripts/core.py zip --flat "$S" "stage/libxray-$TARGET.zip"

      - &record-apple
        name: Record the build
        run: |
          EXTRA=()
          [ -f patch.json ] && EXTRA+=(--patch patch.json --tool "gomobile=$LIBXRAY_GOMOBILE_VERSION")
          [ -f swiftpm.json ] && EXTRA+=(--merge swiftpm=swiftpm.json)
          python ci/.github/scripts/core.py info --src libxray --target "$TARGET" --contents contents.json "${EXTRA[@]}" \
            --tool "xcode=$(xcodebuild -version | paste -sd ' ' -)" \
            --tool "cc=$(xcrun clang --version | head -1)" --out "stage/libxray-$TARGET.json"

      - *upload

  # cgo: LibXray.xcframework of static libXray.a + libXray.h + module map (iOS, iOS simulator,
  # macOS, tvOS). The one the Apple apps link (migration step 10d).
  apple-cgo:
    needs: resolve
    runs-on: macos-26
    timeout-minutes: 90
    env:
      TARGET: apple-cgo
      MAX_MINOS: ios=15.0,macos=13.0
    steps:
      - *select-xcode
      - *checkout-ci
      - *checkout-libxray
      - *setup-python
      - *setup-go

      - name: Build
        working-directory: libxray
        run: python build/main.py apple go

      - *package-apple

      # Builds a macOS 13 executable against the zip as a SwiftPM binaryTarget, checks
      # `swift package compute-checksum`, and calls CGoInvoke for the Xray version.
      - name: Use the zip as a SwiftPM binaryTarget
        run: python ci/.github/scripts/core.py swiftpm "stage/libxray-$TARGET.zip" --platform 13.0 --out swiftpm.json

      - *record-apple
      - *upload

  publish:
    needs: [resolve, linux-x64, windows-x64, android, apple-gomobile, apple-cgo]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      LIBXRAY_COMMIT: ${{ needs.resolve.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: core-*
          path: dist
          merge-multiple: true

      - name: Write manifest.json and SHA256SUMS
        run: |
          python3 .github/scripts/core.py manifest dist
          cat dist/SHA256SUMS
          cat dist/manifest.json

      # Sigstore-signed SLSA provenance for every file in SHA256SUMS:
      # gh attestation verify <file> -R BodoVPN/releases
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Keep the release files with the run
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-preview
          path: |
            dist/manifest.json
            dist/SHA256SUMS
            dist/NOTES.md

      - name: Create or update the pre-release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE="core-$LIBXRAY_TAG"
          TITLE="Xray core $LIBXRAY_TAG (libXray)"
          if gh release view "$RELEASE" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE" dist/libxray-*.zip dist/manifest.json dist/SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$RELEASE" --repo "$GITHUB_REPOSITORY" --prerelease --latest=false --title "$TITLE" --notes-file dist/NOTES.md
          else
            gh release create "$RELEASE" dist/libxray-*.zip dist/manifest.json dist/SHA256SUMS --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --prerelease --latest=false --title "$TITLE" --notes-file dist/NOTES.md
          fi

      - name: The app release is still the latest
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          echo "latest release: $LATEST"
          case "$LATEST" in core-*) echo "::error::$LATEST became the latest release"; exit 1 ;; esac
