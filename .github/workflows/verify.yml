name: Verify client source

# The private BodoVPN/bodovpn-client repo's `make verify` gate, run here because
# public-repo Actions minutes are free. The source is checked out read-only with
# SOURCE_TOKEN and never committed here.
#
# This repo is PUBLIC, and so are its run logs: the gate's output (analyzer findings,
# test failures, generated-file diffs) is written to a file that is never printed or
# uploaded. A failure says only that it failed; run `make verify` locally for the cause.
#
# Trigger: run it by hand (or `gh workflow run verify.yml -R BodoVPN/releases -f ref=<ref>`),
# or `repository_dispatch` (event_type: verify, client_payload.ref).

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit in BodoVPN/bodovpn-client"
        required: true
  repository_dispatch:
    types: [verify]

concurrency:
  group: verify-${{ inputs.ref || github.event.client_payload.ref }}
  cancel-in-progress: true

env:
  SOURCE_REPO: BodoVPN/bodovpn-client
  REF: ${{ inputs.ref || github.event.client_payload.ref }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Check out the private source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.REF }}
          token: ${{ secrets.SOURCE_TOKEN }}

      - name: Resolve Flutter version from .fvmrc
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      # Gradle (Android Lint) and the pinned ktlint/detekt CLIs run on it. No Gradle cache: this
      # repo is public, and a cache of the private build is not something to hand out.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          cache: true

      # make verify's lint-native step (the client's migration phase 9) needs these.
      - name: Native lint tools
        run: |
          command -v shellcheck >/dev/null || sudo apt-get install -y shellcheck
          pwsh -NoProfile -Command 'if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) { Install-Module PSScriptAnalyzer -Scope CurrentUser -Force }'
          shellcheck --version | sed -n 2p
          pwsh -NoProfile -Command '"PSScriptAnalyzer " + (Get-Module -ListAvailable PSScriptAnalyzer | Select-Object -First 1).Version'
          java -version 2>&1 | head -1

      # make verify's lint-cpp step (phase 9c): clang-format and clang-tidy pinned to LLVM 23 like
      # the client's tool/lint_cpp.sh, GTK and Flutter's Linux engine headers for the GTK runner.
      # The Windows sources are tidied by the tidy-windows job below.
      - name: C/C++ lint tools
        run: |
          codename="$(lsb_release -cs)"
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          echo "deb http://apt.llvm.org/$codename/ llvm-toolchain-$codename-23 main" | sudo tee /etc/apt/sources.list.d/llvm-23.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-format-23 clang-tidy-23 libgtk-3-dev >/dev/null
          echo /usr/lib/llvm-23/bin >> "$GITHUB_PATH"
          flutter precache --linux >/dev/null
          /usr/lib/llvm-23/bin/clang-format --version
          /usr/lib/llvm-23/bin/clang-tidy --version | sed -n 2p

      # `flutter build apk --config-only` writes the Gradle wrapper and local.properties that
      # make lint-android runs on, without building anything.
      - name: make verify (output kept private)
        run: |
          echo "source commit: $(git rev-parse HEAD)"
          log="$RUNNER_TEMP/verify.log"
          if flutter pub get > "$log" 2>&1 \
            && flutter build apk --config-only >> "$log" 2>&1 \
            && make verify >> "$log" 2>&1; then
            echo "make verify passed: $(grep -Eio '[0-9]+ tests? passed|All tests passed' "$log" | tail -1)"
          else
            echo "::error::make verify failed. The log stays private in this public repo: run make verify locally."
            exit 1
          fi

      - name: Generated files are committed and current
        run: |
          stale="$(git status --porcelain | wc -l)"
          if [ "$stale" -ne 0 ]; then
            echo "::error::$stale generated file(s) are stale or uncommitted: run make verify and commit the result."
            exit 1
          fi

  # clang-tidy for the Windows engine plugin, runner and setup stub (the client's phase 9c). They
  # include <windows.h>, so this half of the C/C++ lint needs a Windows host; output stays private.
  tidy-windows:
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the private source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.REF }}
          token: ${{ secrets.SOURCE_TOKEN }}

      - name: Resolve Flutter version from .fvmrc
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          cache: true

      # The client's tool/lint_cpp.sh is pinned to LLVM 23; the image's own LLVM may be older.
      - name: LLVM 23.1.2
        shell: pwsh
        run: |
          $msi = "$env:RUNNER_TEMP\llvm.msi"
          curl.exe -sSfL -o $msi https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.2/LLVM-23.1.2-win64.msi
          if ((Get-FileHash $msi -Algorithm SHA256).Hash -ne 'E9D9141524F2C9FE4BF9F37012EFE34F0AA745617BE9E21FFACE9104703C55E5') { throw 'LLVM installer checksum mismatch' }
          $install = Start-Process msiexec.exe -ArgumentList '/a', $msi, '/qn', "TARGETDIR=$env:RUNNER_TEMP\llvm" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "msiexec exited with $($install.ExitCode)" }
          "$env:RUNNER_TEMP\llvm\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          & "$env:RUNNER_TEMP\llvm\LLVM\bin\clang-tidy.exe" --version | Select-Object -Index 1

      - name: C/C++ lint (output kept private)
        run: |
          echo "source commit: $(git rev-parse HEAD)"
          # Refs from before phase 9c (#132) have no C/C++ lint to run; every later ref has the script.
          if [ ! -f tool/lint_cpp.sh ]; then
            echo "No tool/lint_cpp.sh at this ref (predates phase 9c): nothing to tidy."
            exit 0
          fi
          if { flutter pub get && flutter precache --windows && bash tool/lint_cpp.sh; } > "$RUNNER_TEMP/lint-cpp.log" 2>&1; then
            echo "C/C++ lint passed on Windows"
          else
            echo "::error::C/C++ lint failed on Windows. The log stays private in this public repo: run make lint-cpp locally."
            exit 1
          fi

  # swift-format + SwiftLint for the Apple engine and Runner targets (the client's phase 9d). Both
  # need Xcode, so this half of the native lint runs on macOS; output stays private.
  lint-swift:
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the private source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.REF }}
          token: ${{ secrets.SOURCE_TOKEN }}

      # Same Xcode as the release build: swift-format ships with it.
      - name: Select Xcode 26
        run: |
          XCODE="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)"
          if [ -z "$XCODE" ]; then
            echo "::error::No Xcode 26 on this runner image. Installed:"; ls -d /Applications/Xcode*.app; exit 1
          fi
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          xcrun swift-format --version

      # .swiftlint.yml pins the version (swiftlint_version); a ref from before phase 9d has none.
      - name: SwiftLint
        id: swiftlint
        run: |
          want=""
          if [ -f .swiftlint.yml ]; then want="$(sed -n 's/^swiftlint_version: *//p' .swiftlint.yml)"; fi
          if [ -z "$want" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; echo "No .swiftlint.yml pin at this ref"; exit 0; fi
          curl -fsSL -o "$RUNNER_TEMP/swiftlint.zip" "https://github.com/realm/SwiftLint/releases/download/$want/portable_swiftlint.zip"
          sum="$(gh api "repos/realm/SwiftLint/releases/tags/$want" -q '.assets[] | select(.name=="portable_swiftlint.zip") | .digest')"
          echo "${sum#sha256:}  $RUNNER_TEMP/swiftlint.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/swiftlint.zip" -d "$RUNNER_TEMP/swiftlint"
          echo "$RUNNER_TEMP/swiftlint" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/swiftlint/swiftlint" version
        env:
          GH_TOKEN: ${{ github.token }}

      - name: make lint-swift (output kept private)
        if: steps.swiftlint.outputs.skip != 'true'
        run: |
          echo "source commit: $(git rev-parse HEAD)"
          if make lint-swift > "$RUNNER_TEMP/lint-swift.log" 2>&1; then
            echo "Swift lint passed"
          else
            echo "::error::Swift lint failed. The log stays private in this public repo: run make lint-swift locally."
            exit 1
          fi
