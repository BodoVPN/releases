name: Build & publish a release

# This public repo holds ONLY the published apps. The source lives in the private
# BodoVPN/bodovpn-client repo; a tag pushed there dispatches a build here (public-repo
# Actions minutes are free), the source is checked out with a read-only token and never
# committed here, and the artifacts are attached to a release on this repo.
#
# Trigger: `repository_dispatch` (event_type: release, client_payload.tag: vX.Y.Z) from the
# private repo's CI, or run it by hand with the tag.

on:
  repository_dispatch:
    types: [release]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag in BodoVPN/bodovpn-client to build (vX.Y.Z)"
        required: true

concurrency:
  group: release-${{ github.event.client_payload.tag || inputs.tag }}
  cancel-in-progress: false

env:
  SOURCE_REPO: BodoVPN/bodovpn-client
  TAG: ${{ github.event.client_payload.tag || inputs.tag }}

jobs:
  # The release is created once, empty, so the two builders can attach in parallel
  # without racing to create it.
  create-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out the private source at the tag (for its version)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.TAG }}
          token: ${{ secrets.SOURCE_TOKEN }}
          sparse-checkout: pubspec.yaml
          sparse-checkout-cone-mode: false

      - name: Create (or reuse) the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG exists"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "BodoVPN $TAG" --notes "$(cat <<'EOF'
          نسخه جدید بدو وی‌پی‌ان. فایل مناسب دستگاه خود را از بخش Assets دانلود کنید:

          - **Windows** — نصب‌کننده `-windows-x64-setup.exe` را اجرا کنید (فایل `.zip` هم برای نصب دستی هست). اپلیکیشن برای ساخت اتصال VPN اجازه مدیر می‌خواهد.
          - **Linux** — بسته `-linux-x64.deb` را نصب کنید (`sudo apt install ./bodovpn-…deb`)؛ فایل `.tar.gz` هم برای اجرای مستقیم هست.
          - **Android** — فایل `.apk` را نصب کنید؛ نسخه گوگل پلی به‌زودی.
          - **macOS** — فایل `-macos.dmg` را باز کنید و BodoVPN را به Applications بکشید. بار اول، macOS می‌پرسد افزونه شبکه «BodoVPN Tunnel» فعال شود (System Settings → General → Login Items & Extensions → Network Extensions).

          --------

          New BodoVPN release. Pick the file for your device under Assets:

          - **Windows** — run the `-windows-x64-setup.exe` installer (the `.zip` is there for a manual install). The app asks for administrator rights to create the VPN adapter.
          - **Linux** — install the `-linux-x64.deb` (`sudo apt install ./bodovpn-…deb`); the `.tar.gz` runs in place.
          - **Android** — install the `.apk`; the Google Play listing is coming.
          - **macOS** — open the `-macos.dmg` and drag BodoVPN to Applications. On first launch macOS asks you to enable the "BodoVPN Tunnel" network extension (System Settings → General → Login Items & Extensions → Network Extensions).
          EOF
          )"
          fi

      # latest.json is what the backend's /api/client/app/latest reads: the version this
      # release carries and the per-platform download to send each app to.
      - name: Publish the update manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -E '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*//')
          NAME=${VERSION%%+*}
          CODE=${VERSION##*+}
          BASE="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          cat > latest.json <<EOF
          {
            "tag": "$TAG",
            "versionName": "$NAME",
            "versionCode": $CODE,
            "downloads": {
              "windows": "$BASE/bodovpn-$TAG-windows-x64-setup.exe",
              "windowsZip": "$BASE/bodovpn-$TAG-windows-x64.zip",
              "linux": "$BASE/bodovpn-$TAG-linux-x64.deb",
              "linuxTar": "$BASE/bodovpn-$TAG-linux-x64.tar.gz",
              "android": "$BASE/bodovpn-$TAG.apk"
            }
          }
          EOF
          cat latest.json
          gh release upload "$TAG" latest.json --repo "$GITHUB_REPOSITORY" --clobber

  android:
    needs: create-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out the private source at the tag
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.TAG }}
          token: ${{ secrets.SOURCE_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Resolve Flutter version from .fvmrc
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          cache: true

      - run: flutter pub get

      - name: Reconstruct release signing config from secrets
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 is not set on this repo."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/app/release.keystore
          {
            echo "storeFile=release.keystore"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Build release APK (prod flavor)
        run: flutter build apk --release --dart-define=FLAVOR=prod

      - name: Build release AAB (prod flavor, Play signing host)
        run: flutter build appbundle --release --dart-define=FLAVOR=prod --dart-define=TELEGRAM_LOGIN_HOST=app3921234693-login.tg.dev

      - name: Assert the artifacts are release-signed
        run: |
          APKSIGNER=$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}" -name apksigner -type f 2>/dev/null | sort | tail -1)
          if [ -n "$APKSIGNER" ]; then
            CERTS=$("$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk)
            if echo "$CERTS" | grep -q "CN=Android Debug"; then echo "::error::APK is debug-signed"; exit 1; fi
          fi
          AAB_CERTS=$(keytool -printcert -jarfile build/app/outputs/bundle/release/app-release.aab)
          if ! echo "$AAB_CERTS" | grep -q "Owner:"; then echo "::error::AAB is unsigned"; exit 1; fi
          if echo "$AAB_CERTS" | grep -q "CN=Android Debug"; then echo "::error::AAB is debug-signed"; exit 1; fi

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "bodovpn-$TAG.apk"
          cp build/app/outputs/bundle/release/app-release.aab "bodovpn-$TAG.aab"
          gh release upload "$TAG" "bodovpn-$TAG.apk" "bodovpn-$TAG.aab" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Scrub signing material
        if: always()
        run: rm -f android/app/release.keystore android/key.properties

  windows:
    needs: create-release
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - name: Check out the private source at the tag
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.TAG }}
          token: ${{ secrets.SOURCE_TOKEN }}

      - name: Resolve Flutter version from .fvmrc
        id: fvm
        shell: bash
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          cache: true

      - run: flutter pub get

      - name: Fetch the pinned engine binaries (Xray, tun2socks, wintun)
        shell: pwsh
        run: pwsh tool/fetch_windows_engine.ps1

      - name: Build Windows release (prod flavor)
        shell: pwsh
        run: flutter build windows --release --dart-define=FLAVOR=prod

      - name: Assert the bundle is complete
        shell: pwsh
        run: |
          $rel = "build/windows/x64/runner/Release"
          foreach ($f in "bodovpn_client.exe", "bodovpn_link.exe", "xray/xray.exe", "xray/tun2socks.exe", "xray/wintun.dll", "xray/geoip.dat", "xray/geosite.dat") {
            if (-not (Test-Path "$rel/$f")) { Write-Error "missing $f in the Windows bundle"; exit 1 }
          }

      - name: Build the installer (Inno Setup)
        shell: pwsh
        run: |
          $ver = ($env:TAG).TrimStart('v')
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y | Out-Null }
          & $iscc "/DAppVersion=$ver" "/DSourceDir=$PWD\build\windows\x64\runner\Release" "/DOutputDir=$PWD\dist" windows\installer\bodovpn.iss | Select-Object -Last 3
          Get-ChildItem dist

      - name: Attach to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "bodovpn-$env:TAG-windows-x64.zip"
          gh release upload "$env:TAG" "bodovpn-$env:TAG-windows-x64.zip" "dist/bodovpn-$env:TAG-windows-x64-setup.exe" --repo "$env:GITHUB_REPOSITORY" --clobber

  macos:
    needs: create-release
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Check out the private source at the tag
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.TAG }}
          token: ${{ secrets.SOURCE_TOKEN }}

      - name: Resolve Flutter version from .fvmrc
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          cache: true

      - run: flutter pub get

      # Developer ID identity + the two Developer ID provisioning profiles (app and
      # XrayTunnel system extension). The .p12 and profiles are base64 secrets; the
      # keychain is temporary and destroyed at the end of the job.
      - name: Install Developer ID signing material
        env:
          DEVID_P12_BASE64: ${{ secrets.MACOS_DEVID_P12_BASE64 }}
          DEVID_P12_PASSWORD: ${{ secrets.MACOS_DEVID_P12_PASSWORD }}
          PROFILE_APP_BASE64: ${{ secrets.MACOS_PROFILE_APP_BASE64 }}
          PROFILE_TUNNEL_BASE64: ${{ secrets.MACOS_PROFILE_TUNNEL_BASE64 }}
        run: |
          for v in DEVID_P12_BASE64 DEVID_P12_PASSWORD PROFILE_APP_BASE64 PROFILE_TUNNEL_BASE64; do
            [ -n "${!v}" ] || { echo "::error::$v is not set on this repo."; exit 1; }
          done
          KC="$RUNNER_TEMP/bodovpn-signing.keychain-db"
          KC_PW="$(openssl rand -hex 16)"
          echo "KEYCHAIN_PATH=$KC" >> "$GITHUB_ENV"
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          echo "$DEVID_P12_BASE64" | base64 -d > "$RUNNER_TEMP/devid.p12"
          security import "$RUNNER_TEMP/devid.p12" -k "$KC" -P "$DEVID_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" login.keychain
          rm -f "$RUNNER_TEMP/devid.p12"
          P="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; mkdir -p "$P"
          for pair in "PROFILE_APP_BASE64:app" "PROFILE_TUNNEL_BASE64:tunnel"; do
            var="${pair%%:*}"; name="${pair##*:}"
            echo "${!var}" | base64 -d > "$RUNNER_TEMP/$name.provisionprofile"
            uuid="$(security cms -D -i "$RUNNER_TEMP/$name.provisionprofile" | plutil -extract UUID raw -o - -)"
            cp "$RUNNER_TEMP/$name.provisionprofile" "$P/$uuid.provisionprofile"
          done
          security find-identity -v -p codesigning "$KC" | grep -q "Developer ID Application" || { echo "::error::Developer ID identity not usable"; exit 1; }

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Write the notarization key
        env:
          NOTARY_KEY_BASE64: ${{ secrets.MACOS_NOTARY_KEY_BASE64 }}
        run: |
          [ -n "$NOTARY_KEY_BASE64" ] || { echo "::error::MACOS_NOTARY_KEY_BASE64 is not set on this repo."; exit 1; }
          echo "$NOTARY_KEY_BASE64" | base64 -d > "$RUNNER_TEMP/AuthKey.p8"
          echo "NOTARY_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Build, sign, notarize, and package the DMG (prod flavor)
        env:
          FLAVOR: prod
          FLUTTER: flutter
          NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: bash tool/build_macos_dmg.sh

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DMG="$(ls build/macos/dmg/*.dmg | head -1)"
          cp "$DMG" "bodovpn-$TAG-macos.dmg"
          gh release upload "$TAG" "bodovpn-$TAG-macos.dmg" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Scrub signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP"/*.provisionprofile
          [ -n "${KEYCHAIN_PATH:-}" ] && security delete-keychain "$KEYCHAIN_PATH" || true

  linux:
    needs: create-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out the private source at the tag
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.TAG }}
          token: ${{ secrets.SOURCE_TOKEN }}

      - name: Linux desktop toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev unzip

      - name: Resolve Flutter version from .fvmrc
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          cache: true

      - run: flutter pub get

      - name: Fetch the pinned engine binaries (Xray, tun2socks)
        run: bash tool/fetch_linux_engine.sh

      - name: Build Linux release (prod flavor)
        run: flutter build linux --release --dart-define=FLAVOR=prod

      - name: Assert the bundle is complete
        run: |
          B=build/linux/x64/release/bundle
          for f in bodovpn_client lib/xray/xray lib/xray/tun2socks lib/xray/bodovpn-tun-helper lib/xray/geoip.dat lib/xray/geosite.dat; do
            [ -e "$B/$f" ] || { echo "::error::missing $f in the Linux bundle"; exit 1; }
          done
          [ -x "$B/lib/xray/bodovpn-tun-helper" ] || { echo "::error::helper is not executable"; exit 1; }

      - name: Build the .deb
        run: |
          VER=${TAG#v}
          bash linux/packaging/build-deb.sh "$VER" build/linux/x64/release/bundle dist
          dpkg-deb --info "dist/bodovpn-v$VER-linux-x64.deb" | head -12

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -C build/linux/x64/release -czf "bodovpn-$TAG-linux-x64.tar.gz" --transform "s,^bundle,bodovpn," bundle
          gh release upload "$TAG" "bodovpn-$TAG-linux-x64.tar.gz" "dist/bodovpn-$TAG-linux-x64.deb" --repo "$GITHUB_REPOSITORY" --clobber
